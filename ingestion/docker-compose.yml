# OpenSearch single-node cho dev/test cuc bo cua Ingestion (Minh).
# Chay: docker compose -f ingestion/docker-compose.yml up -d
# Dung: docker compose -f ingestion/docker-compose.yml down -v
#
# KHONG dung cau hinh nay cho production (security plugin da tat de don gian hoa dev).

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: log-anomaly-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  opensearch-data:
